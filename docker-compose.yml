services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smartdoc-root}
      MYSQL_DATABASE: smartdoc
      MYSQL_USER: smartdoc
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-smartdoc-db}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./scripts/init_mysql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-smartdoc}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-smartdoc-minio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/smartdoc?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: smartdoc
      DB_PASSWORD: ${MYSQL_PASSWORD:-smartdoc-db}
      SMARTDOC_AUTH_SECRET: ${SMARTDOC_AUTH_SECRET:?SMARTDOC_AUTH_SECRET must be set}
      SMARTDOC_AI_MASTER_KEY_BASE64: ${SMARTDOC_AI_MASTER_KEY_BASE64:-}
      SMARTDOC_AI_ALLOW_LOOPBACK: "false"
      SMARTDOC_AI_ALLOW_PRIVATE_NETWORK: "false"
      SMARTDOC_STORAGE_TYPE: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-smartdoc}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-smartdoc-minio}
    depends_on:
      mysql: {condition: service_healthy}
      minio: {condition: service_healthy}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  minio_data:
