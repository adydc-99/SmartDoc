name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked files and Git history for committed credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $issues = [System.Collections.Generic.List[string]]::new()
          $placeholder = '^(?:<[^>]+>|your[-_ ]?(?:api[-_ ]?)?key|your[-_ ]?token|replace[-_].*|change[-_].*|example.*|test[-_].*|dummy.*)$'
          $keyAssignment = '^(?<name>AI_API_KEY|OPENAI_API_KEY|DEEPSEEK_API_KEY|DASHSCOPE_API_KEY|QWEN_API_KEY)\s*=\s*(?<value>[^#\r\n]+?)\s*(?:#.*)?$'
          $masterAssignment = '^(?<name>SMARTDOC_AI_MASTER_KEY_BASE64|MASTER_KEY|ENCRYPTION_MASTER_KEY|AI_MASTER_KEY)\s*=\s*(?<value>[^#\r\n]+?)\s*(?:#.*)?$'

          function Find-Secrets([string] $content, [string] $subject) {
            $lineNumber = 0
            foreach ($line in ($content -split "`r?`n")) {
              $lineNumber++
              if ($line -match 'sk-[A-Za-z0-9]{20,}') {
                $issues.Add("${subject}:$lineNumber [OpenAI-style key]")
              }
              if ($line -match '(?i)Authorization\s*:\s*Bearer\s+(?<token>[^\s]+)') {
                $token = $Matches.token.Trim('"', "'", '`').TrimEnd('.', ',', ';', ':', ')', ']', '}', '。', '，', '；', '：', '`')
                if ($token -notmatch $placeholder) {
                  $issues.Add("${subject}:$lineNumber [Bearer token]")
                }
              }
              foreach ($assignment in @($keyAssignment, $masterAssignment)) {
                if ($line -match $assignment) {
                  $value = $Matches.value.Trim().Trim('"', "'")
                  if ($value -and $value -notmatch $placeholder) {
                    $issues.Add("${subject}:$lineNumber [$($Matches.name)]")
                  }
                }
              }
            }
          }

          # Scan the checked-out tracked files first.
          foreach ($file in (& git ls-files)) {
            Find-Secrets ([System.IO.File]::ReadAllText((Join-Path $PWD $file))) $file
          }

          # Scan the exact content of every unique blob, never `git show` patch output.
          $seenBlobs = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($revision in (& git rev-list --all)) {
            foreach ($entry in (& git ls-tree -r --full-tree $revision)) {
              if ($entry -notmatch '^\d+ blob (?<blob>[0-9a-f]{40})\t(?<path>.+)$') { continue }
              $blob = $Matches.blob
              $path = $Matches.path
              if (-not $seenBlobs.Add($blob)) { continue }
              $content = (& git cat-file blob $blob) -join "`n"
              Find-Secrets $content "${revision}:$path"
            }
          }

          if ($issues.Count -gt 0) {
            $issues | ForEach-Object { Write-Error $_ }
            throw "Secret scan found $($issues.Count) possible committed credential(s)."
          }
